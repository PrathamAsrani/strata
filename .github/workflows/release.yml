# Publishes ghcr.io/solidgeeks/strata:<version> and :latest, and a GitHub release, on every vX.Y.Z tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solidgeeks/strata:${{ steps.version.outputs.version }}
            ghcr.io/solidgeeks/strata:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SolidGeeks/strata
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Strata $GITHUB_REF_NAME" --generate-notes --verify-tag
