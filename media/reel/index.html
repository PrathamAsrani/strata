<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata</title>
<style>
  /* Two faces: Archivo (condensed for display, wide for the wordmark) and IBM Plex Mono for data. */
  @font-face { font-family: Display; src: url(fonts/display.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: DisplayWide; src: url(fonts/display-wide.ttf) format('truetype'); font-weight: 100 900; }
  @font-face { font-family: UI; src: url(fonts/ui.ttf) format('truetype'); font-weight: 100 599; }
  @font-face { font-family: UI; src: url(fonts/ui-bold.ttf) format('truetype'); font-weight: 600 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
